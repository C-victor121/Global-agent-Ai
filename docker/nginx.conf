# Redirección de HTTP a HTTPS
server {
    listen 80;
    server_name globalsolarco.shop www.globalsolarco.shop;

    return 301 https://$host$request_uri;
}

# Servidor principal en HTTPS
server {
    listen 443 ssl;
    server_name globalsolarco.shop www.globalsolarco.shop;

    # Certificados Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/globalsolarco.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globalsolarco.shop/privkey.pem;

    # Seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Tamaño máximo de peticiones
    client_max_body_size 50M;

    # FRONTEND - Next.js (puerto 3000)
    location / {
        proxy_pass http://client:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # BACKEND - Express API (puerto 3001)
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # n8n panel (puerto 5678) en /n8n
    location /n8n/ {
        proxy_pass http://n8n:5678/;
        rewrite ^/n8n(/.*)$ $1 break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # Webhooks n8n (sin rewrite)
    location /webhook/ {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}
