version: '3.7'

services:
  n8n:
    image: n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST="${SUBDOMAIN}.${DOMAIN_NAME}"
      - N8N_PROTOCOL="https"
      - NODE_ENV=production
      - WEBHOOK_URL="https://${SUBDOMAIN}.${DOMAIN_NAME}/"
      - GENERIC_WEBHOOK_URL="https://${SUBDOMAIN}.${DOMAIN_NAME}/webhook/"
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - n8n_network

networks:
  n8n_network:
    driver: bridge