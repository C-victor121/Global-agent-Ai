version: '3.8'
services:
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - client
      - server
      - n8n
    networks:
      - global_network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/logs:/var/log/letsencrypt
    restart: unless-stopped

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_COOKIE_DOMAIN=${NEXTAUTH_COOKIE_DOMAIN}
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      - NEXT_PUBLIC_N8N_WEBHOOK_URL=${NEXT_PUBLIC_N8N_WEBHOOK_URL}
      - NEXT_PUBLIC_N8N_LEGAL_ASSISTANT_WEBHOOK_URL=${NEXT_PUBLIC_N8N_LEGAL_ASSISTANT_WEBHOOK_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
    networks:
      - global_network
    depends_on:
      - server
    env_file:
      - ../.env

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    expose:
      - "3001"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - MONGODB_URI=${MONGODB_URI}
      - CLIENT_URL=${CLIENT_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - N8N_CONTENT_GENERATION_WEBHOOK_URL=${N8N_CONTENT_GENERATION_WEBHOOK_URL}
      - N8N_LEGAL_ASSISTANT_WEBHOOK_URL=${N8N_LEGAL_ASSISTANT_WEBHOOK_URL}
      - N8N_CONTACT_RESPONSE_WEBHOOK_URL=${N8N_CONTACT_RESPONSE_WEBHOOK_URL}
      - N8N_WHATSAPP_FLOW_WEBHOOK_URL=${N8N_WHATSAPP_FLOW_WEBHOOK_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_APP_ID=${META_APP_ID}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET}
    depends_on:
      - mongo
    networks:
      - global_network
    env_file:
      - ../.env

  mongo:
    image: mongo
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - global_network

  n8n:
    image: n8nio/n8n
    restart: always
    expose:
      - "5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_CORS_ORIGIN=${N8N_CORS_ORIGIN}
      - N8N_LISTEN_ADDRESS=${N8N_LISTEN_ADDRESS}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_WEBHOOK_URL=${GENERIC_WEBHOOK_URL}
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - global_network
    env_file:
      - ../.env

networks:
  global_network:
    driver: bridge

volumes:
  mongo_data:
